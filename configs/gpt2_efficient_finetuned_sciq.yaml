# GPT-2 SciQ fine-tuned checkpoint + efficient AttnLRP via lxt monkey_patch.
# The prompt format matches format_sciq_samples in finetune_gpt2_qa.py.
# The default option shuffle seed is 42. Set data.sciq_shuffle_seed explicitly if training used a different value.
#
# The modelB checkpoint usually contains only pytorch_model.bin / config.json,
# so this config uses the Hub GPT-2 tokenizer, which has the compatible vocabulary.
model:
  family: gpt2_efficient
  name: FT-model/modelB_sciq_1300_qafix
  tokenizer_name: gpt2
  device: cuda
  dtype: float32

data:
  dataset: sciq
  split: validation
  num_samples: 50
  max_length: 512
  hf_dataset: allenai/sciq
  # Uncomment this to use the same local parquet file as scripts/finetune_gpt2_qa.py.
  # sciq_parquet_path: data/sciq/validation-00000-of-00001.parquet
  # Match the fine-tuning --sciq_shuffle_seed value. Options are shuffled with shuffle_seed + row index.
  sciq_shuffle_seed: 42

explain:
  method: attnlrp_gpt2_efficient
  target: argmax_next

parameter_attribution:
  enabled: true
  save_tensors: false
  top_modules: 20

faithfulness:
  steps: 20
  strategy: morf

output:
  dir: outputs-gpt2-ft-sciq-1300
  figures_dir: outputs-gpt2-ft-sciq-1300/figures
