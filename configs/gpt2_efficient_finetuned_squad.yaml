# GPT-2 SQuAD fine-tuned checkpoint + efficient AttnLRP via lxt monkey_patch.
# The model directory must include config.json, model.safetensors, and tokenizer files.
model:
  family: gpt2_efficient
  # Relative paths are resolved from the repository root. Absolute paths are also supported.
  name: FT-model/modelA_squad_gpt2_checkpoint-1600_inference_only
  device: cuda
  # The checkpoint is exported as float32. Use bfloat16 if GPU memory is tight.
  dtype: float32

data:
  dataset: squad_v2
  split: validation
  num_samples: 50
  max_length: 512

explain:
  method: attnlrp_gpt2_efficient
  target: argmax_next

parameter_attribution:
  enabled: true
  save_tensors: false
  top_modules: 20

faithfulness:
  steps: 20
  strategy: morf

output:
  dir: outputs-gpt2-ft-squad-1600
  figures_dir: outputs-gpt2-ft-squad-1600/figures
