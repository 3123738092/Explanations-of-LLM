model:
  name: gpt2            # gpt2 / gpt2-medium / gpt2-large
  device: cuda          # cuda | cpu

data:
  dataset: squad_v2
  split: validation
  num_samples: 50
  max_length: 512

explain:
  method: attnlrp
  target: argmax_next   # logit to explain: next-token argmax at the final position

faithfulness:
  steps: 20
  strategy: morf        # morf (most-relevant-first) | lerf

output:
  dir: outputs
  figures_dir: outputs/figures
